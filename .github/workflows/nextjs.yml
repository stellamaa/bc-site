# Deploy Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Fired by Sanity webhook when content is published (see scripts/setup-sanity-rebuild-webhook.mjs)
  repository_dispatch:
    types: [sanity-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancel an in-flight build when a newer content publish or push arrives
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Don't use static_site_generator: next — it overwrites next.config and drops trailingSlash
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        env:
          GITHUB_PAGES: "true"
        run: npx next build
      - name: Prepare admin routes for GitHub Pages
        run: |
          mkdir -p out/admin
          # Prefer directory index (works with /admin/); fall back from admin.html
          if [ -f out/admin.html ]; then
            cp out/admin.html out/admin/index.html
          fi
          if [ -f out/admin/index.html ]; then
            cp out/admin/index.html out/admin/404.html
          fi
          ls -la out/admin/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
